<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · TableTap</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #fdfbf9; color: #1f1a17; text-align: center; padding: 24px;
      }
      @media (prefers-color-scheme: dark) { body { background: #141210; color: #f6f1ec; } }
      .card { max-width: 340px; }
      .badge {
        width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 20px;
        background: #e85d2a; display: grid; place-items: center; font-size: 30px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; opacity: .7; margin: 0 0 20px; line-height: 1.5; }
      button {
        height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #e85d2a;
        color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">📶</div>
      <h1>You are offline</h1>
      <p>
        Your order screen needs a connection. Reconnect and we will pick up right where you left
        off — nothing in your cart is lost.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
